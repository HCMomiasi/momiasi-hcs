function roomStatus(r) {
  const n = nowMin();
  const list = S.roomb.filter(b => b.roomId === r.id && b.tanggal === TODAY && b.status === 'disetujui' && roomState(b) !== 'hangus').sort((a, b) => a.mulai.localeCompare(b.mulai));
  const cur = list.find(b => toMin(b.mulai) <= n && n < toMin(b.selesai));
  const next = list.filter(b => toMin(b.mulai) > n);
  let cls = 'free', state = 'Tersedia', main = next.length ? `Kosong sampai ${jam(next[0].mulai)}` : 'Kosong sampai akhir hari', sub = next.length ? `${daysLeftMin(toMin(next[0].mulai) - n)} lagi meeting berikutnya` : 'Tidak ada jadwal lagi hari ini', prog = null;
  if (cur && cur.checkinAt) { cls = 'busy'; state = 'Sedang dipakai'; main = esc(cur.judul); sub = `${esc(user(cur.userId).nama)} · selesai ${jam(cur.selesai)} (${daysLeftMin(toMin(cur.selesai) - n)} lagi)`; prog = (n - toMin(cur.mulai)) / (toMin(cur.selesai) - toMin(cur.mulai)); }
  else if (cur) { cls = 'hold'; state = 'Menunggu check-in'; main = esc(cur.judul); sub = `${esc(user(cur.userId).nama)} · dilepas ${jam(fromMin(toMin(cur.mulai) + 15))} jika tidak check-in`; }
  const usedMin = list.filter(b => b.checkinAt || toMin(b.mulai) > n).reduce((a, b) => a + toMin(b.selesai) - toMin(b.mulai), 0);
  return { r, list, cur, next, cls, state, main, sub, prog, usedMin };
}
const daysLeftMin = m => m >= 60 ? `${Math.floor(m / 60)} jam${m % 60 ? ' ' + (m % 60) + ' menit' : ''}` : `${m} menit`;

function gantt(dISO) {
  const T0 = 7 * 60, T1 = 20 * 60, span = T1 - T0, n = nowMin();
  const pct = m => ((Math.min(Math.max(m, T0), T1) - T0) / span * 100).toFixed(2);
  let ticks = '';
  for (let h = 8; h <= 20; h += 2) ticks += `<span class="${h % 4 ? '' : 'm4'}" style="left:${pct(h * 60)}%">${pad(h)}.00</span>`;
  const rows = S.rooms.map(r => {
    const bs = S.roomb.filter(b => b.roomId === r.id && b.tanggal === dISO && ['disetujui', 'menunggu_hcga'].includes(b.status));
    return `<div class="gr"><div class="gl"><b>${r.nama.replace('Ruang ', '')}</b><span>${r.kap} org</span></div><div class="gt">${[...Array(14)].map((_, i) => `<i style="left:${pct((7 + i) * 60)}%"></i>`).join('')}${bs.map(b => { const st = roomState(b); const c = b.status === 'menunggu_hcga' ? 'pend' : st === 'hangus' ? 'lost' : st === 'selesai' ? 'done' : ''; return `<div class="gb ${c}" style="left:${pct(toMin(b.mulai))}%;width:calc(${(pct(toMin(b.selesai)) - pct(toMin(b.mulai))).toFixed(2)}% - 2px)" data-href="#/ruang/${b.id}" data-tip="${esc(b.judul)} · ${jam(b.mulai)}–${jam(b.selesai)} · ${esc(user(b.userId).nama)} · ${ST[st] ? ST[st][0] : st}"><span>${esc(b.judul)}</span></div>`; }).join('')}</div></div>`;
  }).join('');
  const now = dISO === TODAY && n >= T0 && n <= T1 ? `<div class="gnow" style="left:calc(var(--gl) + (100% - var(--gl)) * ${pct(n) / 100})"><em>${pad(Math.floor(n / 60))}.${pad(n % 60)}</em></div>` : '';
  return `<div class="gantt"><div class="gh"><div></div><div class="gx">${ticks}</div></div>${rows}${now}</div>`;
}

/* ===== ARMADA ===== */
function vArmada() {
  const due = s => { const st = dueState(s); if (!s) return '<span class="faint">–</span>'; const n = daysBetween(TODAY, s); return `${fds(s)} ${dt(s).getFullYear()}${st ? `<span class="s" style="color:var(--${st})">${n < 0 ? 'terlewat ' + -n + ' hari' : n + ' hari lagi'}</span>` : ''}`; };
  const vehRows = S.vehicles.map(v => {
    const today = S.cars.filter(c => c.tanggal === TODAY && c.assign?.vehicleId === v.id && ['dijadwalkan', 'berjalan'].includes(c.status));
    return `<tr><td><b>${esc(v.nama)}</b><span class="s num">${v.plat} · ${v.kursi} kursi</span></td><td class="r num">${v.odo.toLocaleString('id-ID')} km</td><td class="num">${due(v.servis)}</td><td class="num">${due(v.pajak)}</td><td class="num">${due(v.kir)}</td><td>${today.length ? `<span class="pill blue">${today.length} tugas hari ini</span>` : '<span class="pill teal">Tersedia</span>'}</td></tr>`;
  }).join('');
  const drvRows = drivers().map(d => {
    const tasks = S.cars.filter(c => c.assign?.driverId === d.id);
    const today = tasks.filter(c => c.tanggal === TODAY && ['dijadwalkan', 'berjalan'].includes(c.status));
    const month = tasks.filter(c => c.status === 'selesai' && c.tanggal.slice(0, 7) === TODAY.slice(0, 7));
    return `<tr><td><b>${esc(d.nama)}</b></td><td>${today.length ? today.map(c => `${jam(c.mulai)} ${esc(c.tujuan)}`).join('<br>') : '<span class="faint">Tidak ada tugas</span>'}</td><td class="r num">${month.length}</td><td class="r num">${month.reduce((a, c) => a + (c.trip ? c.trip.odoEnd - c.trip.odoStart : 0), 0)} km</td></tr>`;
  }).join('');
  return `<div class="page-head"><div><h1>Armada & driver</h1><p class="muted">Kendaraan operasional, jadwal servis, pajak STNK, dan uji KIR.</p></div><button class="btn" data-act="veh-add">${ic('plus')} Tambah kendaraan</button></div>

  ${card('Driver', `<div class="tw"><table class="t"><thead><tr><th>Nama</th><th>Tugas hari ini</th><th class="r">Trip bulan ini</th><th class="r">Jarak bulan ini</th></tr></thead><tbody>${drvRows}</tbody></table></div>`)}`;
}

/* ===== LAPORAN ===== */
function reportData(ym) {
  const inM = s => s && s.slice(0, 7) === ym;
  const depts = [...new Set(S.users.map(u => u.dept))];
  const trips = S.trips.filter(t => inM(t.berangkat) && !['ditolak', 'dibatalkan'].includes(t.status));
  const dinas = depts.map(d => { const ts = trips.filter(t => user(t.userId).dept === d); return { dept: d, n: ts.length, hari: ts.reduce((a, t) => a + allowance(t).days, 0), ca: ts.reduce((a, t) => a + (t.caPaidAt ? t.ca : 0), 0), real: ts.reduce((a, t) => a + (t.settlement?.verifiedAt ? settleTotal(t) : 0), 0) }; }).filter(x => x.n);
  const caOpen = S.trips.filter(t => t.caPaidAt && ['siap', 'settlement'].includes(t.status)).map(t => ({ t, umur: Math.max(0, daysBetween(t.pulang, TODAY)) }));
  const cars = S.cars.filter(c => inM(c.tanggal) && c.status === 'selesai');
  const mobil = S.vehicles.map(v => { const cs = cars.filter(c => c.assign?.vehicleId === v.id); return { v, n: cs.length, km: cs.reduce((a, c) => a + (c.trip ? c.trip.odoEnd - c.trip.odoStart : 0), 0), bbm: cs.reduce((a, c) => a + (c.trip?.bbm || 0), 0), tolpk: cs.reduce((a, c) => a + (c.trip ? c.trip.tol + c.trip.parkir : 0), 0) }; });
  const ext = cars.filter(c => c.assign && c.assign.type !== 'kantor');
  // working days in month up to today (or full month if past)
  const [y, mo] = ym.split('-').map(Number); let wd = 0;
  for (let d = new Date(y, mo - 1, 1); d.getMonth() === mo - 1; d.setDate(d.getDate() + 1)) { if (iso(d) > TODAY) break; if (d.getDay() % 6) wd++; }
  const ruang = S.rooms.map(r => { const bs = S.roomb.filter(b => b.roomId === r.id && inM(b.tanggal) && b.tanggal <= TODAY && b.status === 'disetujui'); const used = bs.filter(b => b.checkinAt); const mins = used.reduce((a, b) => a + toMin(b.selesai) - toMin(b.mulai), 0); return { r, n: bs.length, hangus: bs.filter(b => roomState(b) === 'hangus').length, jam: mins / 60, util: wd ? mins / (wd * 9 * 60) : 0 }; });
  const pend = [];
  S.trips.filter(t => ['menunggu_atasan', 'menunggu_hcga', 'pemesanan', 'settlement'].includes(t.status)).forEach(t => pend.push({ jenis: 'Dinas', no: t.no, siapa: user(t.userId).nama, tahap: ST[t.status][0], umur: (Date.now() - t.log[t.log.length - 1].t) / 864e5, href: `#/dinas/${t.id}` }));
  S.cars.filter(c => c.status === 'menunggu_hcga').forEach(c => pend.push({ jenis: 'Mobil', no: c.no, siapa: user(c.userId).nama, tahap: 'Menunggu HCGA', umur: (Date.now() - c.log[c.log.length - 1].t) / 864e5, href: `#/mobil/${c.id}` }));
  S.aset.filter(a => a.status === 'menunggu_hcga').forEach(a => pend.push({ jenis: 'Aset', no: a.no, siapa: user(a.userId).nama, tahap: 'Menunggu HCGA', umur: (Date.now() - a.log[a.log.length - 1].t) / 864e5, href: `#/aset/${a.id}` }));
  S.roomb.filter(b => b.status === 'menunggu_hcga').forEach(b => pend.push({ jenis: 'Ruang', no: b.no, siapa: user(b.userId).nama, tahap: 'Menunggu HCGA', umur: b.log.length ? (Date.now() - b.log[b.log.length - 1].t) / 864e5 : 0, href: `#/ruang/${b.id}` }));
  pend.sort((a, b) => b.umur - a.umur);
  return { dinas, caOpen, mobil, ext, ruang, pend, wd };
}

/* ---------- helpers ---------- */
const qset = id => S.qsets.find(x => x.id === id);
const keysReady = qs => qs && qs.qs.every(q => q.key != null);
function scoreOf(rec, qsId) {
  if (!rec) return null;
  if (rec.skor != null) return rec.skor;
  const qs = qset(qsId);
  if (!rec.ans || !keysReady(qs)) return null;
  return Math.round(qs.qs.reduce((a, q, i) => a + (rec.ans[i] === q.key ? 1 : 0), 0) / qs.qs.length * 100);
}
const skorTxt = (rec, qsId) => { if (!rec) return '<span class="faint">–</span>'; const s = scoreOf(rec, qsId); return s == null ? '<span class="muted">Menunggu kunci jawaban</span>' : `<b class="num">${s}</b>`; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const f1 = n => n.toLocaleString('id-ID', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const canSeeEmp = uid => isHCGA() || user(uid).atasan === me().id;

const afterPhase = t => !!t.terlaksanaAt || TODAY > t.tanggal;
function trSteps(t, uid) {
  const p = t.prog[uid] || {}, after = afterPhase(t), st = [];
  st.push({ k: 'commit', l: 'Commitment letter', done: !!p.commit, avail: !after || true, ph: 'Sebelum' });
  if (t.tes) st.push({ k: 'pre', l: 'Pretest', done: !!p.pre, skip: after && !p.pre, avail: !after, ph: 'Sebelum' });
  st.push({ k: 'pel', l: 'Pelaksanaan', done: after, auto: true, ph: '' });
  st.push({ k: 'reaction', l: 'Form reaction', done: !!p.reaction, avail: after, ph: 'Sesudah' });
  if (t.tes) st.push({ k: 'post', l: 'Posttest', done: !!p.post, avail: after, ph: 'Sesudah' });
  if (uid === t.userId) st.push({ k: 'result', l: 'Training result', done: !!p.result, avail: after, ph: 'Sesudah' });
  if (t.penyelenggara === 'Internal') st.push({ k: 'piagam', l: 'Piagam', opt: true, done: p.piagam?.status === 'disetujui', pend: p.piagam?.status === 'diajukan', avail: after, ph: 'Sesudah' });
  return st;
}
const pesertaDone = (t, uid) => trSteps(t, uid).every(s => s.opt || s.done || s.skip);
function syncTraining(t) {
  if (['disetujui', 'terlaksana'].includes(t.status)) {
    if (afterPhase(t) && t.status === 'disetujui') t.status = 'terlaksana';
    if (t.status === 'terlaksana' && t.peserta.every(u => pesertaDone(t, u))) { t.status = 'selesai'; t.selesaiAt = Date.now(); }
  }
}
function syncOnb(o) { if (o.status === 'berjalan' && o.post && o.tasks.every(k => k.status === 'selesai')) { o.status = 'selesai'; o.selesaiAt = Date.now(); notify(o.userId, 'Onboarding Anda selesai. Selamat bergabung!', '#/lnd-tugas'); } }
function lndSyncAll() { S.trainings.forEach(syncTraining); S.onb.forEach(syncOnb); }

function stepLine(steps) {
  return `<ol class="sline">${steps.map(s => `<li class="${s.done ? 'done' : s.skip ? 'skip' : s.pend ? 'pend' : s.opt ? 'opt' : ''}" data-tip="${esc(s.l)}: ${s.done ? 'selesai' : s.skip ? 'terlewat' : s.pend ? 'menunggu acc HC' : s.opt ? 'opsional' : 'belum'}"><i></i><span>${s.l}</span></li>`).join('')}</ol>`;
}
function onbSteps(o) {
  const done = o.tasks.filter(k => k.status === 'selesai').length;
  return [{ l: 'Pretest', done: !!o.pre }, { l: 'Pemaparan', done: !!o.pemaparanAt }, { l: 'Posttest', done: !!o.post }, { l: `Tugas ${done}/${o.tasks.length}`, done: done === o.tasks.length }, { l: 'Selesai', done: o.status === 'selesai' }];
}

/* ---------- task counts ---------- */
function myLndTasks() {
  const m = me().id, out = { onb: null, onbVerif: [], train: [], evals: [] };
  lndSyncAll();
  out.onb = S.onb.find(o => o.userId === m && o.status === 'berjalan') || null;
  S.onb.filter(o => o.status === 'berjalan').forEach(o => o.tasks.forEach(k => { if (k.status === 'menunggu' && ((k.verif === 'atasan' && user(o.userId).atasan === m) || (k.verif === 'hc' && isHCGA()))) out.onbVerif.push({ o, k }); }));
  S.trainings.filter(t => ['disetujui', 'terlaksana'].includes(t.status) && t.peserta.includes(m)).forEach(t => { const todo = trSteps(t, m).filter(s => !s.done && !s.skip && !s.opt && !s.auto && s.avail); out.train.push({ t, todo }); });
  S.evals.forEach(e => e.penilai.forEach(p => { if (p.uid === m && !p.s) out.evals.push({ e, p }); }));
  return out;
}
function lndTaskCount() {
  const x = myLndTasks();
  let n = x.onbVerif.length + x.evals.length + x.train.reduce((a, r) => a + r.todo.length, 0);
  if (x.onb) n += (!x.onb.pre ? 1 : 0) + (x.onb.pemaparanAt && !x.onb.post ? 1 : 0) + x.onb.tasks.filter(k => ['belum', 'proses', 'revisi'].includes(k.status)).length;
  return n;
}
function lndPending() {
  const m = me().id;
  const atasan = S.trainings.filter(t => t.status === 'menunggu_atasan' && (user(t.userId).atasan === m || delegasiAktif(user(t.userId).atasan) === m));
  const hc = isHCGA() ? S.trainings.filter(t => t.status === 'menunggu_hcga') : [];
  const piagam = [];
  if (isHCGA()) S.trainings.forEach(t => t.peserta.forEach(u => { if (t.prog[u]?.piagam?.status === 'diajukan') piagam.push({ t, u }); }));
  return { atasan, hc, piagam };
}

/* ======================= DASHBOARD LnD (data asli) ======================= */
function vDashLndReal() {
  lndSyncAll();
  const yr = TODAY.slice(0, 4), m6 = [5, 4, 3, 2, 1, 0].map(monthKey);
  const appr = S.trainings.filter(t => ['disetujui', 'terlaksana', 'selesai'].includes(t.status));
  const yrT = appr.filter(t => t.tanggal.slice(0, 4) === yr);
  const alloc = Object.values(S.lndBudget).reduce((a, b) => a + b, 0), used = Object.keys(S.lndBudget).reduce((a, dp) => a + budgetUsed(dp), 0);
  const reacts = appr.flatMap(t => t.peserta.map(u => t.prog[u]?.reaction).filter(Boolean)).map(r => avg(r.s));
  const running = S.trainings.filter(t => ['disetujui', 'terlaksana'].includes(t.status));
  const onbRun = S.onb.filter(o => o.status === 'berjalan');
  const onbAll = S.onb.filter(o => o.pre && o.post && scoreOf(o.pre, 'qs1') != null && scoreOf(o.post, 'qs1') != null);
  const lift = onbAll.length ? avg(onbAll.map(o => scoreOf(o.post, 'qs1') - scoreOf(o.pre, 'qs1'))) : null;
  const budgetRows = `<div class="brows">${Object.keys(S.lndBudget).map(dp => { const u = budgetUsed(dp), a = S.lndBudget[dp], p = a ? u / a : 0; return `<div class="br" data-tip="${esc(dp)}: ${rp(u)} dari ${rp(a)} (${Math.round(p * 100)}%)" tabindex="0"><div class="bl"><span>${esc(dp)}</span><span class="num muted">${rpc(u)} / ${rpc(a)}</span></div><div class="meter2 ${p > 0.9 ? 'hi' : ''}"><span style="width:${Math.min(100, p * 100)}%"></span></div></div>`; }).join('')}</div>`;
  const perT = appr.filter(t => t.peserta.some(u => t.prog[u]?.reaction)).map(t => { const s = t.peserta.map(u => t.prog[u]?.reaction).filter(Boolean).map(r => avg(r.s)); return { label: t.judul.length > 22 ? t.judul.slice(0, 22) + '…' : t.judul, sub: `${s.length} responden`, value: avg(s), tip: `${t.judul}: ${f1(avg(s))} / 10 dari ${s.length} peserta` }; }).sort((a, b) => b.value - a.value);
  const eAvg = S.evals.map(e => ({ e, a: evalAvg(e) })).filter(x => x.a != null);
  return `<div class="page-head"><div><div class="eyebrow">Learning & Development</div><h1>Dashboard LnD</h1><p class="muted">Onboarding, training, kepuasan peserta, dan penerapan hasil training.</p></div><a class="btn" href="#/lnd-training">Progres training</a></div>
  <div class="tiles">${tile('Training berjalan', running.length, `${running.reduce((a, t) => a + t.peserta.length, 0)} peserta`)}${tile('Budget training terpakai', alloc ? Math.round(used / alloc * 100) + '%' : '–', `${rpc(used)} dari ${rpc(alloc)}`, used / alloc > 0.85 ? 'up' : '')}${tile('Kepuasan training', reacts.length ? f1(avg(reacts)) + ' / 10' : '–', `rata-rata form reaction · ${reacts.length} respon`)}${tile('Kenaikan nilai onboarding', lift != null ? (lift >= 0 ? '+' : '') + Math.round(lift) + ' poin' : '–', 'rata-rata posttest − pretest')}</div>
  <div class="cols">
    <div>${card('Training per bulan', `<div class="card-b">${colChart(m6.map(m => { const n = appr.filter(t => t.tanggal.slice(0, 7) === m).length; return { label: BLN[+m.slice(5) - 1], value: n, tip: `${BULAN[+m.slice(5) - 1]}: ${n} training` }; }), v => v + ' training', v => String(v))}</div>`, '', '6 bulan terakhir · disetujui')}
      ${card('Kepuasan per training', `<div class="card-b">${hbar(perT, v => f1(v))}</div>`, '', 'rata-rata form reaction, skala 1–10')}</div>
    <div>${card('Budget training per divisi', `<div class="card-b">${budgetRows}</div>`, '<a class="link" href="#/lnd-set?tab=budget">Atur</a>', 'terpakai / alokasi ' + yr)}
      ${card('Onboarding berjalan', onbRun.length ? `<div class="list">${onbRun.map(o => `<div class="trrow" data-href="#/onb/${o.id}" style="cursor:pointer"><div class="trh"><b>${esc(user(o.userId).nama)}</b><span class="muted" style="font-size:12.5px">join ${fds(o.join)}</span></div>${stepLine(onbSteps(o))}</div>`).join('')}</div>` : empty('Tidak ada onboarding berjalan.'), '<a class="link" href="#/lnd-onb">Semua</a>')}
      ${card('Hasil 360° terbaru', eAvg.length ? `<div class="list">${eAvg.map(({ e, a }) => row({ href: `#/l360/${e.id}`, title: esc(user(e.userId).nama), sub: esc(e.trainingNama), right: `<b class="num">${f1(a)}</b> / 10` })).join('')}</div>` : empty('Belum ada.'), '<a class="link" href="#/lnd-360">Semua</a>')}</div>
  </div>
  ${card('Training mendatang & berjalan', trTable(running.sort((a, b) => a.tanggal.localeCompare(b.tanggal)), true))}`;
}

const LND_FORMS = {
  training: (fd, f) => {
    const t = { judul: fd.get('judul').trim(), tanggal: fd.get('tanggal'), penyelenggara: fd.get('penyelenggara'), vendor: fd.get('vendor').trim(), mode: fd.get('mode'), harga: +fd.get('harga') || 0 };
    const err = [];
    if (!t.judul) err.push('Judul training wajib diisi.');
    if (!t.vendor) err.push(t.penyelenggara === 'Internal' ? 'Isi nama trainer internal.' : 'Isi nama vendor.');
    if (!t.tanggal || t.tanggal < TODAY) err.push('Tanggal pelaksanaan tidak valid.');
    if (err.length) { $('#formErr').innerHTML = `<div class="alert">${err.join('<br>')}</div>`; return; }
    if (t.penyelenggara === 'Internal' && !/^Trainer internal/.test(t.vendor)) t.vendor = 'Trainer internal · ' + t.vendor;
    const u = me();
    Object.assign(t, { id: 'tr' + uid(), no: nextNo('TR'), userId: u.id, tglAju: TODAY, peserta: [u.id, ...TR_PESERTA], tes: null, status: u.atasan ? 'menunggu_atasan' : 'menunggu_hcga', log: [], prog: {} });
    t.peserta.forEach(p => t.prog[p] = {});
    addLog(t, 'Mengajukan'); S.trainings.push(t);
    if (u.atasan) notify(u.atasan, `${u.nama} mengajukan training "${t.judul}"`, `#/training/${t.id}`); else notifyHCGA(`${u.nama} mengajukan training "${t.judul}"`, `#/training/${t.id}`);
    TR_PESERTA.forEach(p => { notify(p, `${u.nama} menambahkan Anda sebagai peserta training "${t.judul}"`, `#/training/${t.id}`); const a = user(p).atasan; if (a && a !== u.atasan && a !== u.id) notify(a, `${user(p).nama} didaftarkan ikut training "${t.judul}" (info)`, `#/training/${t.id}`); });
    TR_PESERTA = [];
    save(); go(`#/training/${t.id}`); toast('Pengajuan training terkirim');
  },
  tes: (fd, f) => {
    const kind = f.dataset.kind, ref = f.dataset.ref, isOnb = kind.startsWith('onb'), pre = kind.endsWith('pre');
    const src = isOnb ? OB(ref) : TR(ref), qs = qset(isOnb ? 'qs1' : src.tes);
    const ans = qs.qs.map((_, i) => fd.get('q' + i));
    const miss = ans.map((a, i) => a == null ? i + 1 : null).filter(Boolean);
    if (miss.length) { $('#formErr').innerHTML = `<div class="alert">Belum dijawab: soal ${miss.join(', ')}.</div>`; return; }
    const rec = { ans: ans.map(Number), at: Date.now() };
    if (isOnb) { src[pre ? 'pre' : 'post'] = rec; if (pre) notifyHCGA(`${me().nama} sudah mengerjakan pretest onboarding`, `#/onb/${src.id}`); syncOnb(src); }
    else { (src.prog[me().id] = src.prog[me().id] || {})[pre ? 'pre' : 'post'] = rec; syncTraining(src); }
    save(); go('#/lnd-tugas');
    const s = scoreOf(rec, qs.id); toast(s == null ? 'Jawaban terkirim. Nilai muncul setelah HC mengatur kunci jawaban.' : `Jawaban terkirim · nilai ${s}`);
  },
  reaction: (fd, f) => {
    const t = TR(f.dataset.id), s = FORM_REACT_QS.map((_, i) => +fd.get('r' + i) || null);
    const miss = s.map((v, i) => v ? null : i + 1).filter(Boolean);
    if (miss.length) { $('#formErr').innerHTML = `<div class="alert">Belum dinilai: pernyataan ${miss.join(', ')}.</div>`; return; }
    if (!fd.get('saran').trim() || !fd.get('butuh').trim()) { $('#formErr').innerHTML = '<div class="alert">Isi kedua pertanyaan kritik & saran.</div>'; return; }
    (t.prog[me().id] = t.prog[me().id] || {}).reaction = { s, saran: fd.get('saran').trim(), butuh: fd.get('butuh').trim(), at: Date.now() };
    addLog(t, 'Mengisi form reaction'); syncTraining(t); save(); go('#/lnd-tugas'); toast('Terima kasih, form reaction terkirim');
  },
  n360: (fd, f) => {
    const e = S.evals.find(x => x.id === f.dataset.id), p = e.penilai.find(x => x.uid === me().id), s = FORM_360_QS.map((_, i) => +fd.get('s' + i) || null);
    const miss = s.map((v, i) => v ? null : i + 1).filter(Boolean);
    if (miss.length) { $('#formErr').innerHTML = `<div class="alert">Belum dinilai: pernyataan ${miss.join(', ')}.</div>`; return; }
    p.s = s; p.at = Date.now();
    if (e.penilai.every(x => x.s)) notifyHCGA(`Penilaian 360° ${user(e.userId).nama} sudah lengkap`, `#/l360/${e.id}`);
    save(); go('#/lnd-tugas'); toast('Penilaian terkirim');
  },
  l360: (fd, f) => {
    const userId = fd.get('userId'), tid = fd.get('trainingId');
    const pn = [...f.querySelectorAll('#pnRows tr')].map(tr => ({ uid: tr.querySelector('[name=pn]').value, hub: tr.querySelector('[name=hub]').value })).filter(x => x.uid);
    const err = [];
    if (!userId) err.push('Pilih karyawan yang dievaluasi.');
    if (tid === 'lain' && !fd.get('trainingLain').trim()) err.push('Isi nama training.');
    if (!pn.length) err.push('Tambahkan minimal satu penilai.');
    if (new Set(pn.map(x => x.uid)).size !== pn.length) err.push('Ada penilai yang dipilih dua kali.');
    if (err.length) { $('#formErr').innerHTML = `<div class="alert">${err.join('<br>')}</div>`; return; }
    const e = { id: 'e' + uid(), userId, trainingId: tid === 'lain' ? null : tid, trainingNama: tid === 'lain' ? fd.get('trainingLain').trim() : TR(tid).judul, at: Date.now(), by: me().id, penilai: pn.map(x => ({ ...x, s: null })) };
    S.evals.push(e);
    pn.forEach(x => notify(x.uid, `Tugas baru: penilaian 360° untuk ${user(userId).nama}`, `#/n360/${e.id}`));
    save(); go(`#/l360/${e.id}`); toast(`Terkirim ke ${pn.length} penilai`);
  },
  qset: (fd, f) => {
    const s = qset(f.dataset.id);
    s.qs = s.qs.map((q, i) => ({ q: fd.get('q' + i).trim(), opts: [0, 1, 2, 3].map(j => fd.get(`o${i}_${j}`).trim()), key: fd.get('k' + i) != null ? +fd.get('k' + i) : null }));
    rerender(); toast(keysReady(s) ? 'Tersimpan · nilai tes dihitung ulang' : 'Tersimpan · beberapa soal belum punya kunci');
  },
  otmpl: (fd, f) => {
    S.onbTmpl = [...f.querySelectorAll('#otRows tr')].map((tr, i) => ({ id: 'k' + (i + 1) + uid().slice(0, 2), judul: tr.querySelector('[name=judul]').value.trim(), hari: +tr.querySelector('[name=hari]').value || 0, verif: tr.querySelector('[name=verif]').value })).filter(x => x.judul);
    rerender(); toast('Template tugas disimpan · berlaku untuk karyawan onboarding berikutnya');
  },
  lbudget: fd => { for (const [k, v] of fd.entries()) S.lndBudget[k] = +v || 0; rerender(); toast('Budget disimpan'); }
};

const listHtml = a => a && a.length ? `<ol class="olist">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : '<span class="faint">–</span>';
function vFpkDetail(id) {
  const f = FP(id);

  if (!canDiv(f.dept)) return noAccess();
  const m = me(), cs = S.cands.filter(c => c.fpkId === f.id);
  const showGaji = isHCGA() || isDir() || f.userId === m.id;
  let act = '';
  if (f.status === 'menunggu_direktur' && isDir()) act = `<div class="act amber"><div><b>Menunggu persetujuan Anda (Direktur)</b><p>Setelah disetujui, FPK diteruskan ke HCGA.</p></div><div class="btns"><button class="btn danger" data-act="fpk-reject" data-id="${f.id}">Tolak</button><button class="btn primary" data-act="fpk-approve" data-id="${f.id}">Setujui</button></div></div>`;
  else if (f.status === 'menunggu_hcm' && isHCM()) act = `<div class="act amber"><div><b>Menunggu persetujuan HC Manager</b><p>Sudah disetujui Direktur. Setelah disetujui, FPK diteruskan ke tim TA.</p></div><div class="btns"><button class="btn danger" data-act="fpk-reject" data-id="${f.id}">Tolak</button><button class="btn primary" data-act="fpk-approve" data-id="${f.id}">Setujui</button></div></div>`;
  else if (f.status === 'menunggu_ta' && isHCGA()) act = `<div class="act amber"><div><b>FPK masuk ke TA</b><p>Sudah disetujui Direktur & HC Manager. Terima untuk memulai pencarian kandidat.</p></div><div class="btns"><button class="btn primary" data-act="fpk-approve" data-id="${f.id}">Terima & mulai pencarian</button></div></div>`;
  else if (f.status === 'mencari' && isHCGA()) act = `<div class="act"><div><b>Dalam pencarian</b><p>${cs.filter(c => c.stage === 'bergabung').length} dari ${f.jumlah} posisi terisi · deadline ${fd(f.deadline)}</p></div><div class="btns"><button class="btn" data-act="fpk-close" data-id="${f.id}">Tutup lowongan</button><button class="btn primary" data-act="cand-add" data-fpk="${f.id}">${ic('plus')} Tambah kandidat</button></div></div>`;
  const ord = ['menunggu_direktur', 'menunggu_hcm', 'menunggu_ta', 'mencari', 'terpenuhi'], oi = ord.indexOf(f.status);
  const steps = [{ l: 'Diajukan atasan', done: true }, { l: 'Direktur', done: oi > 0 }, { l: 'HC Manager', done: oi > 1 }, { l: 'TA', done: oi > 2 }, { l: 'Pencarian', done: oi > 3 }, { l: 'Terpenuhi', done: oi > 3 }];
  const pipe = STG.map(([k, l]) => ({ k, l, n: cs.filter(c => c.stage === k).length }));
  return `<a class="back" href="#/ta-fpk">${ic('left')} Permintaan karyawan</a>
  <div class="page-head"><div><div class="eyebrow num">${f.no}</div><h1>${esc(f.jabatan)}</h1><p class="muted">${esc(f.dept)} · ${f.level} · ${f.statusPeg} · ${f.jumlah} orang · diajukan ${esc(user(f.userId).nama)}</p></div>${fpkPill(f)}</div>
  ${stepLine(steps)}<div style="height:16px"></div>${act}
  ${['mencari', 'terpenuhi'].includes(f.status) ? card('Kandidat', `<div class="pipe">${pipe.map(p => `<div class="pp"><b class="num">${p.n}</b><span>${p.l}</span></div>`).join('')}</div>${candTable(cs, isHCGA())}`, isHCGA() && f.status === 'mencari' ? `<button class="btn sm" data-act="cand-add" data-fpk="${f.id}">${ic('plus')} Tambah</button>` : '', `${cs.length} kandidat`) : ''}
  <div class="cols-main"><div>
  ${card('Detail permintaan', `<div class="card-b"><dl class="d"><dt>Perusahaan</dt><dd>${esc(f.company || 'Momiasi Indonesia')}</dd><dt>Jabatan</dt><dd>${esc(f.jabatan)}</dd><dt>Departemen</dt><dd>${esc(f.dept)}</dd>${showGaji ? `<dt>Kisaran gaji</dt><dd class="num">${rp(f.gajiMin)} – ${rp(f.gajiMax)}</dd>` : ''}<dt>Level</dt><dd>${f.level}</dd><dt>Status pegawai</dt><dd>${f.statusPeg}</dd><dt>Tes skill</dt><dd>${esc(f.tesSkill) || '–'}</dd><dt>Tanggal permintaan</dt><dd>${fd(f.tglMinta)}</dd><dt>Deadline</dt><dd>${fd(f.deadline)}</dd><dt>Alasan</dt><dd>${f.alasan === 'ganti' ? 'Menggantikan karyawan' : 'Penambahan karyawan baru'}${f.alasanKet ? ': ' + esc(f.alasanKet) : ''}</dd><dt>Kualifikasi</dt><dd>Umur ${f.umurMin}–${f.umurMax} tahun · ${esc(f.pendidikan) || '–'} · ${esc(f.pengalaman) || '–'}${f.tambahan ? ' · ' + esc(f.tambahan) : ''}</dd></dl></div>`)}
  <div class="cols"><div>${card('Job description', `<div class="card-b">${listHtml(f.jobdesc)}</div>`)}</div><div>${card('Qualification', `<div class="card-b">${listHtml(f.kualifikasi)}</div>`)}</div></div>
  ${card('Panduan interview user', `<div class="card-b"><p class="muted" style="margin:0 0 6px;font-size:12.5px">Tampil juga di form User Interview Feedback.</p>${listHtml(f.pertanyaan)}<div class="cols" style="margin-top:12px"><div><b style="font-size:13px">Test skill</b>${listHtml(f.tesList)}</div><div><b style="font-size:13px">Target objective</b>${listHtml(f.target)}</div></div></div>`)}
  </div><div>${card('Riwayat', `<div class="card-b">${timeline(f.log)}</div>`)}</div></div>`;
}

function candTable(list, sel) {
  if (!list.length) return empty('Belum ada kandidat.');
  return `<div class="tw"><table class="t"><thead><tr>${sel ? '<th style="width:36px"><input type="checkbox" class="csel-all" aria-label="Pilih semua"></th>' : ''}<th>Kandidat</th><th class="hide-sm">Posisi</th><th>Tahap</th><th class="r hide-sm">Interview HR</th><th class="r hide-sm">Interview user</th><th class="hide-sm">Sumber</th>${sel ? '<th></th>' : ''}</tr></thead><tbody>${list.map(c => { const f = FP(c.fpkId), h = candAvg(c.hr?.s), u = candAvg(c.uif?.s);
    return `<tr class="click" data-href="#/kandidat/${c.id}">${sel ? `<td>${['ditolak', 'mundur', 'bergabung'].includes(c.stage) ? '' : `<input type="checkbox" class="csel" value="${c.id}" aria-label="Pilih ${esc(c.nama)}">`}</td>` : ''}<td><b>${esc(c.nama)}</b><span class="s">melamar ${fds(c.tglLamar)}</span></td><td class="hide-sm">${esc(f.jabatan)}<span class="s">${esc(f.dept)}</span></td><td>${stgPill(c.stage)}</td><td class="r num hide-sm">${h != null ? f1(h) : '–'}</td><td class="r num hide-sm">${u != null ? f1(u) : '–'}</td><td class="hide-sm">${esc(c.sumber)}</td>${sel ? `<td class="r">${['ditolak', 'mundur', 'bergabung'].includes(c.stage) ? '' : `<button class="btn sm" data-act="cand-invite" data-id="${c.id}">${ic('chat')} Undang</button>`}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;
}

  <div class="rbar"><select style="width:auto" data-nav="kand" data-f="${f}">${opts([['', 'Semua lowongan'], ...fpks.map(x => [x.id, x.jabatan + ' · ' + x.dept])], fp)}</select></div>
  <div class="tabs">${[['proses', 'Dalam proses'], ['bergabung', 'Bergabung'], ['ditolak', 'Ditolak & mundur'], ['semua', 'Semua']].map(([k, l]) => `<a href="#/ta-kandidat?f=${k}${fp ? '&fpk=' + fp : ''}" class="${f === k ? 'on' : ''}">${l} <span class="c">${g[k].length}</span></a>`).join('')}</div>
  ${fbar('kand', { dept: true, ph: 'Cari nama kandidat, posisi, sumber…' })}

  <section class="card">${candTable(g[f], isHCGA())}</section>`;

function scoreTable(labels, s, c) {
  return `<div class="tw"><table class="t"><thead><tr><th>Aspek</th><th class="r" style="width:80px">Nilai</th><th class="hide-sm">Catatan</th></tr></thead><tbody>${labels.map((l, i) => `<tr><td class="ni">${esc(l)}</td><td class="r"><span class="hm" style="background:${HEAT[Math.min(5, Math.max(1, Math.round((s[i] - 1) / 9 * 5)))]};color:${s[i] >= 7.5 ? '#fff' : 'var(--ink)'}">${s[i]}</span></td><td class="hide-sm muted">${c && c[i] && c[i] !== '-' ? esc(c[i]) : ''}</td></tr>`).join('')}</tbody><tfoot><tr><td>Rata-rata</td><td class="r num">${f1(avg(s))}</td><td class="hide-sm"></td></tr></tfoot></table></div>`;
}
function invRows(c) {
  if (!c.invites.length) return empty('Belum ada undangan.');
  return `<div class="list">${c.invites.slice().reverse().map(i => `<div class="row" style="cursor:default"><span class="rm"><span class="rt">${JENIS_INV[i.jenis]} · ${hariTgl(i.tgl)}, ${jam(i.jam)}</span><span class="rs">${i.mode} · ${esc(i.lokasi)} · ${i.iv.map(x => esc(user(x).nama)).join(', ')}${i.alasan ? ` · "${esc(i.alasan)}"` : ''}</span></span><span class="rr">${isHCGA() ? chanTags(i) : ''}${invPill(i.status)}${isHCGA() ? `<button class="btn sm" data-act="inv-send" data-c="${c.id}" data-i="${i.id}">Kirim ulang</button>` : ''}</span></div>`).join('')}</div>`;
}
function candAction(c) {
  if (!isHCGA()) {
    const iv = lastInv(c, 'user');
    if (c.stage === 'user' && iv && iv.iv.includes(me().id) && !c.uif) return iv.tgl <= TODAY && iv.status === 'hadir' ? `<div class="act amber"><div><b>Isi User Interview Feedback</b><p>Interview ${fd(iv.tgl)}. Penilaian Anda menjadi bahan keputusan rekrutmen.</p></div><a class="btn primary" href="#/uif/${c.id}">Isi feedback</a></div>` : `<div class="act"><div><b>Interview user ${fd(iv.tgl)}, ${jam(iv.jam)}</b><p>${INV_ST[iv.status][0]}. Form feedback terbuka setelah interview.</p></div></div>`;
    return '';
  }
  const f = FP(c.fpkId), tolak = `<button class="btn danger" data-act="cand-reject" data-id="${c.id}">Tolak</button>`;
  const nx = (to, l) => `<button class="btn primary" data-act="cand-next" data-id="${c.id}" data-to="${to}">${l}</button>`;
  const hrI = lastInv(c, 'hr'), uI = lastInv(c, 'user');
  if (c.stage === 'hr') {
    if (!hrI || ['tolak', 'jadwal_ulang'].includes(hrI.status)) return `<div class="act amber"><div><b>${hrI ? 'Kandidat ' + INV_ST[hrI.status][0].toLowerCase() : 'Jadwalkan Interview HR'}</b><p>Undangan otomatis dari template, dikirim lewat WhatsApp & email.</p></div><div class="btns">${tolak}<button class="btn primary" data-act="inv-new" data-id="${c.id}" data-j="hr">Kirim undangan Interview HR</button></div></div>`;
    if (!c.hr) return `<div class="act"><div><b>Interview HR ${fd(hrI.tgl)}, ${jam(hrI.jam)}</b><p>${INV_ST[hrI.status][0]}. Isi penilaian setelah interview.</p></div><div class="btns">${tolak}<a class="btn primary" href="#/hrscore/${c.id}">Isi penilaian Interview HR</a></div></div>`;
    return `<div class="act"><div><b>Penilaian HR: ${f1(avg(c.hr.s))} / 10 · rekomendasi ${c.hr.rek}</b><p>Lanjutkan ke tahap berikutnya.</p></div><div class="btns">${tolak}${f.tesSkill ? nx('tes', 'Lanjut · tes skill') : nx('user', 'Lanjut · Interview user')}</div></div>`;
  }
  if (c.stage === 'tes') return `<div class="act"><div><b>Tes skill: ${esc(f.tesSkill)}</b><p>${c.tes ? `Nilai ${c.tes.nilai} · ${esc(c.tes.catatan || '')}` : 'Catat hasil tes kandidat.'}</p></div><div class="btns">${tolak}${c.tes ? nx('user', 'Lanjut · Interview user') : `<button class="btn primary" data-act="tes-input" data-id="${c.id}">Input hasil tes</button>`}</div></div>`;
  if (c.stage === 'user') {
    if (!uI || ['tolak', 'jadwal_ulang'].includes(uI.status)) return `<div class="act amber"><div><b>${uI ? 'Kandidat ' + INV_ST[uI.status][0].toLowerCase() : 'Jadwalkan Interview user'}</b><p>Interviewer default: ${esc(user(f.userId).nama)} (pengaju FPK).</p></div><div class="btns">${tolak}<button class="btn primary" data-act="inv-new" data-id="${c.id}" data-j="user">Kirim undangan Interview user</button></div></div>`;
    if (!c.uif) return `<div class="act"><div><b>Interview user ${fd(uI.tgl)}, ${jam(uI.jam)}</b><p>${INV_ST[uI.status][0]} · menunggu User Interview Feedback dari ${uI.iv.map(x => esc(user(x).nama)).join(', ')}.</p></div><div class="btns">${tolak}</div></div>`;
    return `<div class="act"><div><b>User: ${c.uif.lanjut === 'Ya' ? 'lanjut ke tahap berikutnya' : c.uif.lanjut === 'Tidak' ? 'tidak dilanjutkan' : 'dipertimbangkan'} · ${f1(avg(c.uif.s))} / 10</b><p>${esc(c.uif.alasan)}</p></div><div class="btns">${tolak}${nx('offering', 'Lanjut · offering')}</div></div>`;
  }
  if (c.stage === 'offering') {
    if (!c.offer || c.offer.resp === 'tolak') return `<div class="act amber"><div><b>${c.offer ? 'Kandidat menolak offering' : 'Buat offering letter'}</b><p>Kisaran gaji FPK: ${rp(f.gajiMin)} – ${rp(f.gajiMax)}.</p></div><div class="btns">${tolak}<button class="btn primary" data-act="offer-new" data-id="${c.id}">${c.offer ? 'Revisi offering' : 'Buat & kirim offering'}</button></div></div>`;
    if (c.offer.resp === 'menunggu') return `<div class="act"><div><b>Offering terkirim · menunggu jawaban kandidat</b><p>Batas konfirmasi ${fd(c.offer.batas)}.</p></div><div class="btns"><button class="btn" data-act="offer-send" data-id="${c.id}">Kirim ulang</button><a class="btn" href="#/offer/${c.id}">Lihat halaman kandidat</a></div></div>`;
    return `<div class="act amber"><div><b>Kandidat menerima offering</b><p>Mulai bekerja ${fd(c.offer.mulai)}. Buat akun karyawan: undangan login terkirim dan onboarding LnD langsung berjalan.</p></div><button class="btn primary" data-act="cand-join" data-id="${c.id}">Proses bergabung</button></div>`;
  }
  if (c.stage === 'bergabung') return `<div class="act"><div><b>Sudah bergabung</b><p>${c.userId ? `Akun ${esc(user(c.userId).nama)} · mulai ${fd(c.offer?.mulai || TODAY)}` : ''}</p></div>${c.userId && S.onb.some(o => o.userId === c.userId) ? `<a class="btn" href="#/onb/${S.onb.find(o => o.userId === c.userId).id}">Lihat onboarding</a>` : ''}</div>`;
  return '';
}
function vCandDetail(id) {

  const steps = STG.map(([k, l], i) => ({ l, done: idx >= 0 ? i < idx || c.stage === 'bergabung' : false }));
  return `<a class="back" href="#/ta-kandidat">${ic('left')} Kandidat</a>

  ${stepLine(steps)}<div style="height:16px"></div>${candAction(c)}
  <div class="cols-main"><div>

  ${card('Jadwal & undangan', invRows(c))}
  ${c.hr ? card('Penilaian Interview HR', scoreTable(F_HR, c.hr.s, c.hr.c) + `<div class="card-b">${kv('Rekomendasi', c.hr.rek)}<p class="muted" style="margin:4px 0 0;font-size:13px">${esc(c.hr.alasan)}</p></div>`, '', `oleh ${esc(user(c.hr.by).nama)}`) : ''}
  ${c.uif ? card('User Interview Feedback', scoreTable(F_UIF.map(x => x.t), c.uif.s, c.uif.c) + `<div class="card-b">${kv('Diproses ke tahap selanjutnya?', c.uif.lanjut)}<p class="muted" style="margin:4px 0 0;font-size:13px">${esc(c.uif.alasan)}</p></div>`, '', `oleh ${esc(user(c.uif.by).nama)} · ${fds(c.uif.tgl)}`) : ''}
  ${c.offer ? card('Offering', `<div class="card-b"><dl class="d"><dt>Gaji</dt><dd class="num">${rp(c.offer.gaji)}${c.offer.gaji > f.gajiMax ? ' <span class="pill amber">di atas kisaran FPK</span>' : ''}</dd><dt>Mulai bekerja</dt><dd>${fd(c.offer.mulai)}</dd><dt>Status</dt><dd>${c.offer.statusPeg}${c.offer.statusPeg === 'PKWT' ? ` · ${c.offer.durasi} bulan · probation 3 bulan` : ''}</dd><dt>Benefit</dt><dd>${esc(c.offer.benefit || '–')}</dd><dt>Jawaban</dt><dd>${{ menunggu: 'Menunggu', terima: 'Diterima', tolak: 'Ditolak' }[c.offer.resp]}${c.offer.respAt ? ' · ' + fdt(c.offer.respAt) : ''}</dd></dl></div>`, `<a class="link" href="#/offer/${c.id}">Offering letter</a>`) : ''}
  </div><div>${card('Riwayat', `<div class="card-b">${timeline(c.log)}</div>`)}</div></div>`;

function vDashTAReal() {
  const open = S.fpk.filter(f => f.status === 'mencari'), proses = S.cands.filter(c => ['hr', 'tes', 'user', 'offering'].includes(c.stage));
  const offers = S.cands.filter(c => c.offer && c.offer.resp !== 'menunggu'), acc = offers.filter(c => c.offer.resp === 'terima');
  const tth = acc.map(c => { const f = FP(c.fpkId); return f.approvedAt && c.offer.respAt ? (c.offer.respAt - f.approvedAt) / 864e5 : null; }).filter(x => x != null);
  const funnel = STG.map(([k, l], i) => ({ l, n: S.cands.filter(c => { const ci = STG.findIndex(s => s[0] === c.stage); const reached = ci >= 0 ? ci : (c.hr ? (c.uif ? 2 : 0) : 0); return reached >= i; }).length }));

  const m6 = [5, 4, 3, 2, 1, 0].map(monthKey), hires = m6.map(m => S.cands.filter(c => c.stage === 'bergabung' && c.offer && c.offer.mulai.slice(0, 7) === m).length);
  const iv = S.cands.flatMap(c => c.invites.map(i => ({ c, i }))).filter(x => x.i.tgl >= TODAY).sort((a, b) => (a.i.tgl + a.i.jam).localeCompare(b.i.tgl + b.i.jam)).slice(0, 5);
  const ending = S.users.filter(u => { const e = contractEnd(u); return e && daysBetween(TODAY, e) <= 30 && daysBetween(TODAY, e) >= -7; });
  return `<div class="page-head"><div><div class="eyebrow">Talent Acquisition</div><h1>Dashboard TA</h1><p class="muted">Permintaan karyawan, pipeline kandidat, kecepatan rekrutmen, dan kontrak yang akan berakhir.</p></div><a class="btn" href="#/ta-kandidat">Kandidat</a></div>

  <div class="cols">
    <div>${card('Pipeline kandidat', `<div class="card-b">${fun}</div>`, '', 'semua lowongan')}${card('Sumber kandidat', `<div class="card-b">${hbar(src, v => v + ' orang')}</div>`)}</div>
    <div>${card('Karyawan baru bergabung', `<div class="card-b">${colChart(m6.map((m, i) => ({ label: BLN[+m.slice(5) - 1], value: hires[i], tip: `${BULAN[+m.slice(5) - 1]}: ${hires[i]} orang` })), v => v + ' org', v => String(v))}</div>`, '', '6 bulan terakhir')}
      ${card('Interview terdekat', iv.length ? `<div class="list">${iv.map(x => row({ href: `#/kandidat/${x.c.id}`, tag: x.i.jenis === 'hr' ? 'HR' : 'User', title: esc(x.c.nama), sub: `${relDay(x.i.tgl)} ${jam(x.i.jam)} · ${esc(FP(x.c.fpkId).jabatan)}`, right: invPill(x.i.status) })).join('')}</div>` : empty('Tidak ada.'), '<a class="link" href="#/ta-jadwal">Jadwal</a>')}

  const words = st.q.toLowerCase().split(/\s+/).filter(Boolean), rows = filterRows(bar); let n = 0;
  rows.forEach(r => { const tx = r.textContent.toLowerCase(); const ok = words.every(w => tx.includes(w)) && (!st.status || [...r.querySelectorAll('.pill')].some(p => p.textContent.trim() === st.status)) && (!st.dept || r.textContent.includes(st.dept)); r.hidden = !ok; if (ok) n++; });
  const any = st.q || st.status || st.dept;
  $('#fcount').textContent = any ? `${n} dari ${rows.length} ditampilkan` : `${rows.length} data`;
  $('#view').querySelectorAll('.fnone').forEach(x => x.remove());
  if (any && !n) bar.insertAdjacentHTML('afterend', `<div class="fnone">Tidak ada data yang cocok. <button class="btn sm" data-act="freset">Hapus filter</button></div>`);
}

function exportCsv(k, ym) {
  if (IS_ARTIFACT) return toast(NO_FILE_MSG);
  const R = reportData(ym);
  let rows;
  if (k === 'dinas') rows = [['Departemen', 'Perjalanan', 'Hari dinas', 'CA dicairkan', 'Realisasi']].concat(R.dinas.map(x => [x.dept, x.n, x.hari, x.ca, x.real]));
  if (k === 'ca') rows = [['No', 'Karyawan', 'Tujuan', 'Pulang', 'CA', 'Hari sejak pulang']].concat(R.caOpen.map(({ t, umur }) => [t.no, user(t.userId).nama, t.tujuan, t.pulang, t.ca, umur]));
  if (k === 'mobil') rows = [['Kendaraan', 'Plat', 'Trip', 'Km', 'BBM', 'Tol & parkir']].concat(R.mobil.map(x => [x.v.nama, x.v.plat, x.n, x.km, x.bbm, x.tolpk]));
  if (k === 'ruang') rows = [['Ruangan', 'Booking', 'Hangus', 'Jam terpakai', 'Utilisasi %']].concat(R.ruang.map(x => [x.r.nama, x.n, x.hangus, x.jam.toFixed(1), Math.round(x.util * 100)]));
  if (k === 'aset') rows = [['No', 'Pemohon', 'Barang', 'Kategori', 'Qty', 'Nilai', 'Status']].concat(S.aset.filter(a => a.no.includes('/' + ym.replace('-', '/') + '/')).map(a => [a.no, user(a.userId).nama, a.nama, a.kategori, a.qty, asetTotal(a), ST[a.status] ? ST[a.status][0] : a.status]));
  if (k === 'pend') rows = [['Jenis', 'No', 'Pemohon', 'Tahap', 'Menunggu (hari)']].concat(R.pend.map(x => [x.jenis, x.no, x.siapa, x.tahap, x.umur.toFixed(1)]));
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `laporan-${k}-${ym}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('File diunduh');
}

const SETK = ['rooms', 'rateA', 'rateB', 'zona', 'lndBudget', 'ldTpl', 'qsets', 'onbTmpl', 'taTpl', 'delegasi'];
const blank = () => ({ v: 10, persona: 'karyawan', loggedIn: false, meId: null, seq: {}, delegasi: null, rooms: [], rateA: {}, rateB: [], zona: [], lndBudget: {}, ldTpl: [], qsets: [], onbTmpl: [], taTpl: {}, ...Object.fromEntries(Object.keys(TBL).map(k => [k, []])) });
let SNAP = {}, SESSION = null, BUSY = 0, PUB = null;
S = blank();

/* ---------- muat data ---------- */
async function fetchAll(t, cols = 'data') {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(t).select(cols).order(t === 'settings' ? 'key' : 'id').range(from, from + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) return rows;
  }
}
async function loadAll() {
  const keys = Object.keys(TBL);
  const [sets, ...lists] = await Promise.all([fetchAll('settings', 'key,data'), ...keys.map(k => fetchAll(TBL[k]))]);
  const n = blank(), snap = { settings: {} };
  keys.forEach((k, i) => { n[k] = lists[i].map(r => r.data); snap[k] = Object.fromEntries(n[k].map(o => [o.id, JSON.stringify(o)])); });
  sets.forEach(r => { if (SETK.includes(r.key)) n[r.key] = r.data; });
  if (!sets.some(r => r.key === 'qsets')) { const q = await sb.rpc('qsets_public'); n.qsets = q.data || []; }
  SETK.forEach(k => { snap.settings[k] = JSON.stringify(n[k] ?? null); });
  const mx = (re, src) => Math.max(0, ...[...JSON.stringify(src).matchAll(re)].map(m => +m[1]));
  n.seq = { AST: mx(/AST-\d{4}-(\d{3})/g, n.aset), PGM: mx(/PGM\/\d{4}\/\d{2}\/(\d{3})/g, n.trainings) };
  const meU = n.users.find(u => u.id === SESSION?.user.id);
  if (!['admin', 'superadmin'].includes(meU?.role)) n.users = n.users.filter(u => u.akun !== 'menunggu');
  Object.assign(n, { loggedIn: !!meU && meU.akun === 'aktif', meId: meU?.id || null, persona: meU ? personaOf(meU, n) : 'karyawan' });
  S = n; SNAP = snap;
  return meU;
}
function personaOf(u, n = S) {
  if (u.role === 'superadmin') return 'superadmin';
  if (u.role === 'admin') return 'admin';
  if (u.posisi === 'Driver') return 'driver';
  if (u.level === 'Direktur') return 'direktur';
  if (u.role === 'atasan') return 'atasan';
  return n.onb.some(o => o.userId === u.id && o.status === 'berjalan') ? 'baru' : 'karyawan';
}

/* ---------- simpan (diff -> insert/update) ---------- */
let QUEUED = false, chain = Promise.resolve();
save = function () { if (!S.loggedIn || QUEUED) return; QUEUED = true; queueMicrotask(() => { QUEUED = false; chain = chain.then(push).catch(syncFail); }); };
async function push() {
  const myId = S.meId; let changed = false;
  for (const [k, t] of Object.entries(TBL)) {
    const snap = SNAP[k] || (SNAP[k] = {});
    for (const o of [...S[k]]) {
      const j = JSON.stringify(o);
      if (snap[o.id] === j) continue;
      BUSY++;
      try {
        if (!(o.id in snap) && k === 'users') { const old = o.id, r = await fn('create', { profile: o }); Object.assign(o, r.profile); if (o.id !== old) remapId(old, o.id); }
        else if (!(o.id in snap) && k === 'notifs' && o.userId !== myId) {
          const { error } = await sb.from(t).insert({ id: o.id, data: o }); if (error) throw error;
          S.notifs = S.notifs.filter(x => x !== o); continue;
        } else {
          const q = o.id in snap ? sb.from(t).update({ data: o }).eq('id', o.id) : sb.from(t).insert({ id: o.id, data: o });
          const { data, error } = await q.select('data').maybeSingle();
          if (error) throw error;
          if (!data) throw new Error('Anda tidak berhak mengubah data ini');
          for (const key in data.data) if (JSON.stringify(o[key]) !== JSON.stringify(data.data[key])) { o[key] = data.data[key]; changed = true; }
        }
        snap[o.id] = JSON.stringify(o);
      } finally { BUSY--; }
    }
  }
  for (const k of SETK) {
    const j = JSON.stringify(S[k] ?? null);
    if (SNAP.settings[k] === j || (k === 'qsets' && !isHCGA())) continue;
    const { error } = await sb.from('settings').upsert({ key: k, data: S[k] ?? null });
    if (error) throw error;
    SNAP.settings[k] = j;
  }
  if (changed) softRender();
}
function remapId(a, b) {
  for (const k of Object.keys(TBL)) S[k] = S[k].map(o => { const j = JSON.stringify(o); return j.includes(a) ? Object.assign(o, JSON.parse(j.split(a).join(b))) : o; });
}
async function syncFail(e) {
  const msg = e?.message || String(e);
  toast(/JWT|token/i.test(msg) ? 'Sesi berakhir, silakan login ulang' : 'Tidak tersimpan: ' + msg);
  try { await loadAll(); } catch (_) {}
  render();
}
function softRender() { if (!$('#modal').classList.contains('open') && !document.activeElement?.closest('form')) rerenderQuiet(); }
function rerenderQuiet() { const y = window.scrollY; render(); window.scrollTo(0, y); }
nextNo = p => `${p}/AUTO`;
async function fn(action, body = {}) {
  const { data, error } = await sb.functions.invoke('admin-user', { body: { action, redirectTo: BASE + '?aktivasi=1', ...body } });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (_) {} throw new Error(m); }
  return data;
}

/* ---------- unggah berkas ke Storage ---------- */
document.addEventListener('change', async e => {
  const inp = e.target;
  if (inp.type !== 'file' || !S.loggedIn || !inp.files.length) return;
  const files = [...inp.files].filter(f => !/\.csv$/i.test(f.name));
  if (!files.length) return;
  if (files.some(f => f.size > 10 * 1024 * 1024)) { toast('Maksimal 10 MB per file'); inp.value = ''; return; }
  const form = inp.form, btn = form && form.querySelector('button:not([type=button])'); if (btn) btn.disabled = true;
  try {
    for (const f of files) {
      const path = `${S.meId}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g, '_')}`;
      const up = await sb.storage.from('files').upload(path, f); if (up.error) throw up.error;
      const r = await sb.from('uploads').insert({ name: f.name, path }); if (r.error) throw r.error;
    }
    toast(files.length > 1 ? `${files.length} file terunggah` : 'File terunggah');
  } catch (err) { toast('Gagal mengunggah: ' + err.message); inp.value = ''; }
  finally { if (btn) btn.disabled = false; }
}, true);
document.addEventListener('click', async e => {
  const el = e.target.closest('.file'); if (!el || !S.loggedIn || e.target.closest('[data-act]')) return;
  const name = el.textContent.trim();
  const { data } = await sb.from('uploads').select('path').eq('name', name).order('created_at', { ascending: false }).limit(1);
  if (!data?.length) return toast('File asli tidak tersedia (data contoh / tidak berhak melihat)');
  const s = await sb.storage.from('files').createSignedUrl(data[0].path, 300);
  if (s.error) return toast(s.error.message);
  window.open(s.data.signedUrl, '_blank', 'noopener');
});

/* ---------- link untuk kandidat & karyawan ---------- */
const tokGen = () => Array.from(crypto.getRandomValues(new Uint8Array(18)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
fakeLink = path => {
  const [k, a, b] = path.split('/');
  if (k === 'k' || k === 'o') {
    const c = CD(a), x = c && (k === 'o' ? c.offer : c.invites.find(i => i.id === b));
    if (!x) return BASE;
    if (!x.tok) { x.tok = tokGen(); save(); }
    return `${BASE}#/${k === 'o' ? 'offer' : 'konfirmasi'}/${x.tok}`;
  }
  return BASE + ({ ecr: `#/ecr/${a}`, tugas: '#/lnd-tugas', review: `#/review/${a}` }[k] || '#/');
};

/* halaman kandidat tanpa login: isi S dengan data publik dari token lalu pakai tampilan yang sama */
const vKonfirmasi0 = vKonfirmasi, vOffer0 = vOffer;
function pubView(kind, tok) {
  if (PUB && PUB.tok === tok && PUB.d) {
    const d = PUB.d, iv = (d.invite?.iv || []).map((n, i) => ({ id: 'iv' + i, nama: n })), keep = S;
    S = { ...S, users: [{ id: 'hc', nama: d.hc?.nama || 'Tim HC', jabatan: d.hc?.jabatan || 'HCGA', role: 'superadmin', akun: 'aktif' }, ...iv],
      fpk: [{ id: 'f', jabatan: d.jabatan, dept: d.dept, level: d.level }],
      cands: [{ id: 'c', fpkId: 'f', nama: d.nama, email: d.email, invites: d.invite ? [{ ...d.invite, id: 'i', iv: iv.map(x => x.id) }] : [], offer: d.offer, log: [] }] };
    try { return (kind === 'offer' ? vOffer0('c') : vKonfirmasi0('c', 'i')).replace(/<div class="demo-note">[\s\S]*?<\/div>/, ''); } finally { S = keep; }
  }
  if (PUB && PUB.tok === tok && PUB.err) return `<div class="cand"><div class="cand-in"><div class="lw" style="width:130px">${LOGO()}</div><h1 style="margin-top:18px">Link tidak berlaku</h1><p class="muted">Link ini tidak ditemukan atau sudah tidak aktif. Hubungi tim Talent Acquisition Momiasi.</p></div></div>`;
  PUB = { tok };
  sb.rpc('cand_public', { tok }).then(({ data, error }) => { PUB = { tok, d: data, err: error || !data }; render(); });
  return '<div class="cand"><div class="cand-in"><p class="muted">Memuat…</p></div></div>';
}
vKonfirmasi = (a, b) => S.loggedIn && CD(a) ? vKonfirmasi0(a, b) : pubView('konfirmasi', a);
vOffer = a => S.loggedIn && CD(a) ? vOffer0(a) : pubView('offer', a);
async function candRespond(resp, alasan) {
  const { error } = await sb.rpc('cand_respond', { tok: PUB.tok, resp, alasan: alasan || '' });
  if (error) return toast(error.message);
  PUB.d = null; const { data } = await sb.rpc('cand_public', { tok: PUB.tok }); PUB.d = data; render(); toast('Terima kasih, jawaban Anda terkirim');
}

/* ---------- auth ---------- */
function prodLogin(html) { return html.replace(/<div class="demo-box">[\s\S]*?<\/form>/, '</form>'); }
const vLogin0 = vLogin; vLogin = q => prodLogin(vLogin0(q));
vAktivasi = () => {
  const u = S.users.find(x => x.id === SESSION?.user.id);
  if (!u) return `<div class="auth"><div class="authbox"><div class="lw" style="width:150px">${LOGO()}</div><h1 style="margin-top:22px">Link tidak berlaku</h1><p class="muted">Link aktivasi sudah kedaluwarsa atau sudah dipakai. Minta link baru ke HCGA.</p><a class="btn" href="#/login">Ke halaman masuk</a></div></div>`;
  return `<div class="auth"><form class="authbox" data-form="aktivasi" data-id="${u.id}" novalidate>
    <div class="lw" style="width:150px">${LOGO()}</div>
    <h1 style="margin-top:22px">${u.akun === 'undangan' ? 'Aktifkan akun' : 'Buat password baru'}</h1><p class="muted" style="margin:4px 0 20px">Halo ${esc(u.nama.split(' ')[0])}, buat password untuk ${esc(u.email)}.</p>
    <div class="form"><div class="f"><label>Password baru</label><input type="password" name="p1" autocomplete="new-password"><span class="hint">Minimal 8 karakter.</span></div>
    <div class="f"><label>Ulangi password</label><input type="password" name="p2" autocomplete="new-password"></div>
    <div id="formErr"></div><button class="btn primary" style="height:42px">Simpan & masuk</button></div></form></div>`;
};
const authErr = m => { const el = $('#formErr'); if (el) el.innerHTML = `<div class="alert">${m}</div>`; };
async function enter(first) {
  const u = await loadAll();
  if (!u) { await sb.auth.signOut(); SESSION = null; return authErr('Akun belum terdaftar di Momiasi HCS. Hubungi HCGA.'); }
  if (u.akun === 'nonaktif') { await sb.auth.signOut(); SESSION = null; S = blank(); return authErr('Akun ini sudah dinonaktifkan.'); }
  if (u.akun === 'undangan') return go('#/aktivasi');
  go(location.hash && !/^#\/(login|aktivasi)?$/.test(location.hash) ? location.hash : '#/');
  if (first) toast(`Selamat datang, ${u.nama.split(' ')[0]}`);
}
const FORMS_CLOUD = {
  login: async fd => {
    const email = (fd.get('email') || '').trim().toLowerCase(), password = fd.get('password') || '';
    if (!email || !password) return authErr('Isi email dan password.');
    authErr('Memeriksa…');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return authErr(/invalid/i.test(error.message) ? 'Email atau password salah.' : /banned/i.test(error.message) ? 'Akun belum disetujui HC atau sudah dinonaktifkan. Hubungi HCGA.' : esc(error.message));
    SESSION = data.session; await enter(true);
  },
  aktivasi: async fd => {
    const p1 = fd.get('p1') || '';
    if (p1.length < 8) return authErr('Password minimal 8 karakter.');
    if (p1 !== fd.get('p2')) return authErr('Password tidak sama.');
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) return authErr(esc(error.message));
    const u = S.users.find(x => x.id === SESSION.user.id);
    if (u.akun === 'undangan') {
      const { error: e2 } = await sb.from('profiles').update({ data: { ...u, akun: 'aktif' } }).eq('id', u.id);
      if (e2) return authErr(esc(e2.message));
      await loadAll(); notifyHCGA(`${u.nama} sudah mengaktifkan akun`, '#/pengaturan?tab=karyawan'); save();
    }
    history.replaceState(null, '', BASE + '#/'); toast('Password tersimpan'); await enter(true);
  },
  konfirmasi: (fd, f) => f.dataset.c !== 'c' ? FORMS0.konfirmasi(fd, f) : candRespond(fd.get('r'), (fd.get('alasan') || '').trim()),
  'offer-resp': (fd, f) => f.dataset.c !== 'c' ? FORMS0['offer-resp'](fd, f) : candRespond('terima')
};
FORMS_CLOUD.daftar = async (fd, f) => {
  const g = k => (fd.get(k) || '').trim();
  if (g('nama').length < 3 || !g('jabatan')) return authErr('Isi nama lengkap dan jabatan.');
  if ((fd.get('p1') || '').length < 8) return authErr('Password minimal 8 karakter.');
  if (fd.get('p1') !== fd.get('p2')) return authErr('Password tidak sama.');
  const btn = f.querySelector('button.primary'); btn.disabled = true; authErr('Mengirim…');
  const { error } = await sb.functions.invoke('daftar', { body: { nama: g('nama'), email: g('email'), hp: g('hp'), company: g('company'), dept: g('dept'), jabatan: g('jabatan'), password: fd.get('p1') } });
  btn.disabled = false;
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (_) {} return authErr(esc(m)); }
  go('#/daftar/terkirim');
};
regApply = async (u, f) => {
  try {
    const r = await fn('approve', { id: u.id, profile: f });
    await loadAll(); render(); toast(`Akun ${u.nama} aktif`);
    const p = r.profile;
    sendModal(`Kabari ${p.nama}`, [{ ke: p.nama, hp: p.hp || '', email: p.email, subjek: 'Akun Momiasi HCS Anda sudah aktif',
      text: `Halo ${p.nama.split(' ')[0]},\n\nPendaftaran akun Momiasi HCS Anda sudah disetujui HC. Silakan masuk di ${BASE} memakai email ${p.email} dan password yang Anda buat saat mendaftar.\n\nTim HCGA Momiasi` }]);
  } catch (e) { toast(e.message); }
};
regReject = async u => { try { await fn('reject', { id: u.id }); await loadAll(); render(); toast('Pendaftaran ditolak'); } catch (e) { toast(e.message); } };
const FORMS0 = { ...FORMS }; Object.assign(FORMS, FORMS_CLOUD);
const ACT0 = { ...ACT };
Object.assign(ACT, {
  logout: async () => { await sb.auth.signOut(); SESSION = null; S = blank(); SNAP = {}; go('#/login'); },
  forgot: () => modal('Lupa password', '<p style="margin:0">Masukkan email kantor. Link untuk membuat password baru akan dikirim ke email tersebut. Jika tidak masuk dalam beberapa menit, minta link reset ke HCGA.</p><div class="f"><label>Email</label><input type="email" name="email" placeholder="nama@momiasi.id" autofocus></div>', 'Kirim link', fd => {

  }),
  'invite-view': async d => {

      sendModal(baru ? `Undangan akun · ${u.nama}` : `Link reset password · ${u.nama}`, [{ ke: u.nama, hp: u.hp || '', email: u.email, subjek: baru ? 'Akun Momiasi HCS Anda' : 'Reset password Momiasi HCS', text }]);
    } catch (e) { toast(e.message); }
  },
  'akun-off': d => { const u = user(d.id); modal(`Nonaktifkan akun ${esc(u.nama)}?`, '<p style="margin:0">Karyawan tidak bisa login lagi. Riwayat pengajuannya tetap tersimpan untuk laporan.</p>', 'Nonaktifkan', () => {
    fn('ban', { id: u.id }).then(() => { u.akun = 'nonaktif'; rerender(); toast('Akun dinonaktifkan'); }).catch(e => toast(e.message)); }, true); },
  'akun-on': d => { const u = user(d.id); fn('unban', { id: u.id }).then(() => { u.akun = 'aktif'; rerender(); toast('Akun diaktifkan kembali'); }).catch(e => toast(e.message)); },
  'offer-tolak': d => d.id !== 'c' ? ACT0['offer-tolak'](d) : candRespond('tolak'),
  reset: () => { toast('Memuat ulang data…'); loadAll().then(() => { render(); toast('Data diperbarui'); }); }
});

/* render tahan banting: satu data rusak tidak membuat halaman macet */

render = function () {
  try { render0(); }
  catch (e) { console.error(e); document.body.classList.remove('bare'); $('#view').innerHTML = `<div class="page-head"><div><h1>Halaman gagal dimuat</h1><p class="muted">${esc(e.message)}</p></div></div><a class="btn" href="#/">Kembali ke beranda</a>`; }
};
window.addEventListener('hashchange', () => render());

/* ---------- boot ---------- */
async function boot() {
  document.querySelectorAll('.lw-slot').forEach(el => { el.innerHTML = LOGO(); });
  const { data } = await sb.auth.getSession();
  SESSION = data.session;
  if (AUTH_HASH && SESSION) { await loadAll(); history.replaceState(null, '', BASE + '#/aktivasi'); return render(); }
  if (SESSION) { try { await enter(false); } catch (e) { toast(e.message); go('#/login'); } }
  render();
}
sb.auth.onAuthStateChange((ev, s) => { SESSION = s; if (ev === 'SIGNED_OUT' && S.loggedIn) { S = blank(); go('#/login'); } });
setInterval(async () => {
  if (!S.loggedIn || BUSY || QUEUED || document.hidden || $('#modal').classList.contains('open') || document.activeElement?.closest('form')) return;
  try { await chain; await loadAll(); rerenderQuiet(); } catch (_) {}
}, 60000);
boot();
